name: Build APT repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg curl jq dpkg-dev

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Find latest Obsidian release
        run: |
          mkdir -p incoming

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest \
            -o release.json

          echo "Latest release:"
          jq -r '.tag_name' release.json

          echo "Available assets:"
          jq -r '.assets[].name' release.json

      - name: Download Obsidian amd64 .deb
        run: |
          DEB_URL=$(jq -r '
            .assets[]
            | select(.name | test("^obsidian[_-].*amd64\\.deb$"))
            | .browser_download_url
          ' release.json | head -n 1)

          if [ -z "$DEB_URL" ] || [ "$DEB_URL" = "null" ]; then
            echo "ERROR: No amd64 .deb found in the latest Obsidian release."
            exit 1
          fi

          echo "Downloading:"
          echo "$DEB_URL"

          curl -fL "$DEB_URL" -o incoming/obsidian.deb

          echo "Downloaded package:"
          dpkg-deb --info incoming/obsidian.deb

      - name: Build APT repository
        run: |
          rm -rf site
          mkdir -p site

          cp -r conf site/conf

          cd site

          reprepro includedeb stable ../incoming/obsidian.deb

          cp ../apt-repo-public-key.asc .

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
