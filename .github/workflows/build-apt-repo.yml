name: Build APT repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            reprepro \
            gnupg \
            curl \
            jq \
            dpkg-dev

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Prepare repository
      # ------------------------------------------------------------

      - name: Prepare APT repository
        run: |
          mkdir -p apt-repo/conf

          cp conf/distributions apt-repo/conf/distributions
          cp apt-repo-public-key.asc apt-repo/

      # ------------------------------------------------------------
      # Obsidian
      # ------------------------------------------------------------

      - name: Download latest Obsidian
        run: |
          mkdir -p incoming

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest \
            -o obsidian-release.json

          VERSION=$(jq -r '.tag_name' obsidian-release.json)

          echo "Obsidian version: $VERSION"

          DEB_URL=$(jq -r '
            .assets[]
            | select(.name | test("^obsidian[_-].*amd64\\.deb$"))
            | .browser_download_url
          ' obsidian-release.json | head -n 1)

          test -n "$DEB_URL"
          test "$DEB_URL" != "null"

          curl -fL "$DEB_URL" \
            -o incoming/obsidian.deb

          dpkg-deb --info incoming/obsidian.deb

      # ------------------------------------------------------------
      # Chirpity
      # ------------------------------------------------------------

      - name: Download and package latest Chirpity
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mattk70/Chirpity-Electron/releases/latest \
            -o chirpity-release.json

          VERSION=$(jq -r '.tag_name' chirpity-release.json)

          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"

          echo "Chirpity version: $VERSION"

          APPIMAGE_URL=$(jq -r '
            .assets[]
            | select(.name == "Chirpity-x86_64.AppImage")
            | .browser_download_url
          ' chirpity-release.json)

          test -n "$APPIMAGE_URL"
          test "$APPIMAGE_URL" != "null"

          curl -fL "$APPIMAGE_URL" \
            -o /tmp/Chirpity.AppImage

          chmod +x /tmp/Chirpity.AppImage

          # Extract the AppImage so we can reuse Chirpity's
          # own desktop file and icons.
          cd /tmp
          ./Chirpity.AppImage --appimage-extract >/dev/null

          cd "$GITHUB_WORKSPACE"

          mkdir -p chirpity-deb/DEBIAN
          mkdir -p chirpity-deb/opt/chirpity
          mkdir -p chirpity-deb/usr/bin
          mkdir -p chirpity-deb/usr/share/applications

          # Install the actual application.
          cp /tmp/Chirpity.AppImage \
            chirpity-deb/opt/chirpity/Chirpity.AppImage

          # Command-line launcher.
          cat > chirpity-deb/usr/bin/chirpity <<'EOF'
          #!/bin/sh
          exec /opt/chirpity/Chirpity.AppImage "$@"
          EOF

          chmod 755 chirpity-deb/usr/bin/chirpity

          # --------------------------------------------------------
          # Find Chirpity's desktop file
          # --------------------------------------------------------

          DESKTOP_FILE=$(find /tmp/squashfs-root \
            -type f \
            -name '*.desktop' \
            | head -n 1)

          if [ -n "$DESKTOP_FILE" ]; then
            echo "Found desktop file: $DESKTOP_FILE"

            cp "$DESKTOP_FILE" \
              chirpity-deb/usr/share/applications/chirpity.desktop

            # Make the desktop file invoke our installed launcher.
            sed -i 's|^Exec=.*|Exec=/usr/bin/chirpity %U|' \
              chirpity-deb/usr/share/applications/chirpity.desktop

            # The AppImage's desktop file may contain a different
            # application name. Keep the visible name as Chirpity.
            sed -i 's|^Name=.*|Name=Chirpity|' \
              chirpity-deb/usr/share/applications/chirpity.desktop
          else
            echo "No desktop file found in AppImage."

            cat > chirpity-deb/usr/share/applications/chirpity.desktop <<'EOF'
          [Desktop Entry]
          Name=Chirpity
          Comment=AI-powered bird vocalisation analysis
          Exec=/usr/bin/chirpity %U
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Science;
          EOF
          fi

          # --------------------------------------------------------
          # Install Chirpity's official icon
          # --------------------------------------------------------

          ICON_SOURCE="/tmp/squashfs-root/usr/share/icons/hicolor/1024x1024/apps/chirpity.png"

          if [ -f "$ICON_SOURCE" ]; then
            mkdir -p \
              chirpity-deb/usr/share/icons/hicolor/1024x1024/apps

            cp "$ICON_SOURCE" \
              chirpity-deb/usr/share/icons/hicolor/1024x1024/apps/chirpity.png

            echo "Installed official Chirpity icon."
          else
            echo "ERROR: Chirpity icon not found:"
            echo "$ICON_SOURCE"
            exit 1
          fi

          # The desktop file uses Icon=chirpity.
          if grep -q '^Icon=' \
            chirpity-deb/usr/share/applications/chirpity.desktop; then
            sed -i 's|^Icon=.*|Icon=chirpity|' \
              chirpity-deb/usr/share/applications/chirpity.desktop
          else
            sed -i '/^\[Desktop Entry\]/a Icon=chirpity' \
              chirpity-deb/usr/share/applications/chirpity.desktop
          fi


          # --------------------------------------------------------
          # Debian package metadata
          # --------------------------------------------------------

          cat > chirpity-deb/DEBIAN/control <<EOF
          Package: chirpity
          Version: ${VERSION}-1
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Tialu06
          Description: Chirpity bird vocalisation analyser
           AI-powered bird vocalisation analysis application.
          EOF

          dpkg-deb \
            --build \
            --root-owner-group \
            chirpity-deb \
            incoming/chirpity_${VERSION}-1_amd64.deb

          dpkg-deb \
            --info \
            incoming/chirpity_${VERSION}-1_amd64.deb


      # ------------------------------------------------------------
      # Build APT repository
      # ------------------------------------------------------------

      - name: Add packages to APT repository
        run: |
          reprepro \
            --basedir apt-repo \
            includedeb stable incoming/obsidian.deb

          reprepro \
            --basedir apt-repo \
            includedeb stable incoming/chirpity_*.deb

      - name: Show repository
        run: |
          echo "=== Packages ==="
          find apt-repo/pool -type f -print

          echo
          echo "=== Metadata ==="
          find apt-repo/dists -type f -print

      # ------------------------------------------------------------
      # Publish with GitHub Pages
      # ------------------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apt-repo

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
