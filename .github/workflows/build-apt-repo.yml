
name: Build APT repository

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force a full repository build"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

env:
  STORE_TAG: apt-package-store

jobs:
  check:
    name: Check for new releases
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      obsidian_changed: ${{ steps.compare.outputs.obsidian_changed }}
      chirpity_changed: ${{ steps.compare.outputs.chirpity_changed }}
      obsidian_version: ${{ steps.versions.outputs.obsidian }}
      chirpity_version: ${{ steps.versions.outputs.chirpity }}

    steps:
      - uses: actions/checkout@v6

      - name: Check upstream releases
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest \
            -o /tmp/obsidian.json

          curl -fsSL \
            https://api.github.com/repos/Mattk70/Chirpity-Electron/releases/latest \
            -o /tmp/chirpity.json

          obsidian=$(jq -er '.tag_name | select(. != "")' /tmp/obsidian.json)
          chirpity=$(jq -er '.tag_name | select(. != "")' /tmp/chirpity.json)
          chirpity="${chirpity#v}"
          chirpity="${chirpity#V}"

          echo "obsidian=$obsidian" >> "$GITHUB_OUTPUT"
          echo "chirpity=$chirpity" >> "$GITHUB_OUTPUT"

      - name: Compare published versions
        id: compare
        env:
          OBSIDIAN: ${{ steps.versions.outputs.obsidian }}
          CHIRPITY: ${{ steps.versions.outputs.chirpity }}
          FORCE_BUILD: ${{ inputs.force_build }}
        shell: bash
        run: |
          set -euo pipefail

          old_obsidian=$(jq -r '.obsidian // empty' versions.json)
          old_chirpity=$(jq -r '.chirpity // empty' versions.json)

          obsidian_changed=false
          chirpity_changed=false

          [[ "$OBSIDIAN" == "$old_obsidian" ]] || obsidian_changed=true
          [[ "$CHIRPITY" == "$old_chirpity" ]] || chirpity_changed=true

          changed=false
          if [[ "$obsidian_changed" == true ||
                "$chirpity_changed" == true ||
                "$FORCE_BUILD" == true ]]; then
            changed=true
          fi

          echo "obsidian_changed=$obsidian_changed" >> "$GITHUB_OUTPUT"
          echo "chirpity_changed=$chirpity_changed" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          echo "Obsidian: $old_obsidian -> $OBSIDIAN"
          echo "Chirpity: $old_chirpity -> $CHIRPITY"
          echo "Build required: $changed"

  build:
    name: Build APT repository
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg curl jq dpkg-dev

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p incoming apt-repo/conf
          cp conf/distributions apt-repo/conf/distributions
          cp apt-repo-public-key.asc apt-repo/

      # The release store is the durable source for unchanged packages.
      - name: Check package store
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$STORE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download unchanged packages from store
        if: steps.store.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          assets=$(gh release view "$STORE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')

          for app in obsidian chirpity; do
            if ! grep -Fxq "$app.deb" <<< "$assets"; then
              echo "Missing stored asset: $app.deb"
              exit 1
            fi

            case "$app" in
              obsidian) changed="${{ needs.check.outputs.obsidian_changed }}" ;;
              chirpity) changed="${{ needs.check.outputs.chirpity_changed }}" ;;
            esac

            if [[ "$changed" != true ]]; then
              gh release download "$STORE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$app.deb" \
                --dir incoming
            fi
          done

      - name: Download Obsidian
        if: needs.check.outputs.obsidian_changed == 'true' || steps.store.outputs.exists != 'true'
        run: |
          set -euo pipefail

          curl -fsSL \
            https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest \
            -o /tmp/obsidian.json

          url=$(jq -er '
            [.assets[]
             | select(.name | test("^obsidian[_-].*amd64\\.deb$"))
             | .browser_download_url][0] // empty
          ' /tmp/obsidian.json)

          curl -fL "$url" -o incoming/obsidian.deb
          dpkg-deb --info incoming/obsidian.deb

      - name: Download Chirpity
        if: needs.check.outputs.chirpity_changed == 'true' || steps.store.outputs.exists != 'true'
        run: |
          set -euo pipefail

          curl -fsSL \
            https://api.github.com/repos/Mattk70/Chirpity-Electron/releases/latest \
            -o /tmp/chirpity.json

          url=$(jq -er '
            [.assets[]
             | select(.name == "Chirpity-x86_64.AppImage")
             | .browser_download_url][0] // empty
          ' /tmp/chirpity.json)

          curl -fL "$url" -o /tmp/Chirpity.AppImage
          chmod +x /tmp/Chirpity.AppImage

      - name: Build Chirpity Debian package
        if: needs.check.outputs.chirpity_changed == 'true' || steps.store.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.check.outputs.chirpity_version }}
        run: |
          set -euo pipefail

          cd /tmp
          rm -rf squashfs-root
          ./Chirpity.AppImage --appimage-extract >/dev/null
          cd "$GITHUB_WORKSPACE"

          mkdir -p chirpity-deb/DEBIAN
          mkdir -p chirpity-deb/opt/chirpity
          mkdir -p chirpity-deb/usr/bin
          mkdir -p chirpity-deb/usr/share/applications
          mkdir -p chirpity-deb/usr/share/icons/hicolor/1024x1024/apps
          mkdir -p chirpity-deb/usr/share/pixmaps

          cp /tmp/Chirpity.AppImage \
            chirpity-deb/opt/chirpity/Chirpity.AppImage

          cat > chirpity-deb/usr/bin/chirpity <<'EOF'
          #!/bin/sh
          exec /opt/chirpity/Chirpity.AppImage "$@"
          EOF
          chmod 755 chirpity-deb/usr/bin/chirpity

          icon=/tmp/squashfs-root/usr/share/icons/hicolor/1024x1024/apps/chirpity.png
          test -f "$icon"
          cp "$icon" chirpity-deb/usr/share/icons/hicolor/1024x1024/apps/chirpity.png
          cp "$icon" chirpity-deb/usr/share/pixmaps/chirpity.png

          cat > chirpity-deb/usr/share/applications/chirpity.desktop <<'EOF'
          [Desktop Entry]
          Name=Chirpity
          Comment=Chirpity is a bioacoustics platform for the analysis of bird song and other wildlife sounds.
          Exec=/usr/bin/chirpity %U
          Terminal=false
          Type=Application
          Icon=chirpity
          StartupWMClass=chirpity
          Categories=Utility;
          EOF

          cat > chirpity-deb/DEBIAN/control <<EOF
          Package: chirpity
          Version: ${VERSION}-1
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Tialu06
          Description: Chirpity bird vocalisation analyser
           AI-powered bird vocalisation analysis application.
          EOF

          dpkg-deb --build --root-owner-group \
            chirpity-deb incoming/chirpity.deb

          dpkg-deb --info incoming/chirpity.deb

      - name: Verify both packages
        run: |
          set -euo pipefail
          test -s incoming/obsidian.deb
          test -s incoming/chirpity.deb
          dpkg-deb --info incoming/obsidian.deb
          dpkg-deb --info incoming/chirpity.deb

      # Update the durable package store before deploying Pages.
      - name: Create or update package store release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$STORE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$STORE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "APT package store" \
              --notes "Persistent Debian packages used to build the APT repository." \
              --prerelease
          fi

          for app in obsidian chirpity; do
            case "$app" in
              obsidian) changed="${{ needs.check.outputs.obsidian_changed }}" ;;
              chirpity) changed="${{ needs.check.outputs.chirpity_changed }}" ;;
            esac

            if [[ "$changed" == true ]] ||
               [[ "${{ steps.store.outputs.exists }}" != true ]]; then
              gh release upload "$STORE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber "incoming/$app.deb"
            fi
          done

      - name: Build APT repository
        run: |
          set -euo pipefail

          reprepro --basedir apt-repo \
            includedeb stable incoming/obsidian.deb

          reprepro --basedir apt-repo \
            includedeb stable incoming/chirpity.deb

          test -f apt-repo/dists/stable/Release
          test -f apt-repo/dists/stable/main/binary-amd64/Packages

          grep -A20 '^Package: obsidian$' \
            apt-repo/dists/stable/main/binary-amd64/Packages

          grep -A20 '^Package: chirpity$' \
            apt-repo/dists/stable/main/binary-amd64/Packages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apt-repo

  deploy:
    name: Deploy GitHub Pages
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  update-state:
    name: Record published versions
    needs: [check, deploy]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Update versions.json
        env:
          OBSIDIAN: ${{ needs.check.outputs.obsidian_version }}
          CHIRPITY: ${{ needs.check.outputs.chirpity_version }}
        run: |
          set -euo pipefail

          jq -n \
            --arg obsidian "$OBSIDIAN" \
            --arg chirpity "$CHIRPITY" \
            '{obsidian: $obsidian, chirpity: $chirpity}' \
            > versions.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add versions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published package versions"
            git push
          fi
