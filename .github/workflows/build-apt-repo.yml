name: Build APT repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout APT repository state
        uses: actions/checkout@v6
        with:
          ref: apt-data
          path: repo
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            reprepro \
            gnupg \
            curl \
            jq \
            dpkg-dev \
            desktop-file-utils

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Obsidian
      # ------------------------------------------------------------

      - name: Check latest Obsidian version
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest \
            -o obsidian-release.json

          jq -r '.tag_name' obsidian-release.json

      - name: Download latest Obsidian
        run: |
          mkdir -p incoming

          DEB_URL=$(jq -r '
            .assets[]
            | select(.name | test("^obsidian[_-].*amd64\\.deb$"))
            | .browser_download_url
          ' obsidian-release.json | head -n 1)

          test -n "$DEB_URL"
          test "$DEB_URL" != "null"

          echo "Downloading Obsidian:"
          echo "$DEB_URL"

          curl -fL "$DEB_URL" -o incoming/obsidian.deb

          dpkg-deb --info incoming/obsidian.deb

      # ------------------------------------------------------------
      # Chirpity
      # ------------------------------------------------------------

      - name: Check latest Chirpity version
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mattk70/Chirpity-Electron/releases/latest \
            -o chirpity-release.json

          jq -r '.tag_name' chirpity-release.json

      - name: Download and package Chirpity
        run: |
          CHIRPITY_VERSION=$(jq -r '.tag_name' chirpity-release.json)

          VERSION="${CHIRPITY_VERSION#v}"
          VERSION="${VERSION#V}"

          echo "Chirpity version: $VERSION"

          APPIMAGE_URL=$(jq -r '
            .assets[]
            | select(.name == "Chirpity-x86_64.AppImage")
            | .browser_download_url
          ' chirpity-release.json)

          test -n "$APPIMAGE_URL"
          test "$APPIMAGE_URL" != "null"

          echo "Downloading Chirpity:"
          echo "$APPIMAGE_URL"

          curl -fL "$APPIMAGE_URL" \
            -o /tmp/Chirpity.AppImage

          chmod +x /tmp/Chirpity.AppImage

          mkdir -p chirpity-deb/DEBIAN
          mkdir -p chirpity-deb/opt/chirpity
          mkdir -p chirpity-deb/usr/bin

          cp /tmp/Chirpity.AppImage \
            chirpity-deb/opt/chirpity/Chirpity.AppImage

          cat > chirpity-deb/usr/bin/chirpity <<'EOF'
          #!/bin/sh
          exec /opt/chirpity/Chirpity.AppImage "$@"
          EOF

          chmod 755 chirpity-deb/usr/bin/chirpity

          cat > chirpity-deb/DEBIAN/control <<EOF
          Package: chirpity
          Version: ${VERSION}-1
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Tialu06
          Description: Chirpity bird vocalisation analyser
           AI-powered bird vocalisation analysis application.
          EOF

          dpkg-deb \
            --build \
            --root-owner-group \
            chirpity-deb \
            incoming/chirpity_${VERSION}-1_amd64.deb

          dpkg-deb --info incoming/chirpity_${VERSION}-1_amd64.deb

      # ------------------------------------------------------------
      # APT repository
      # ------------------------------------------------------------

      - name: Add packages to repository
        run: |
          cp source/apt-repo-public-key.asc repo/

          reprepro \
            --basedir repo \
            includedeb stable incoming/obsidian.deb

          reprepro \
            --basedir repo \
            includedeb stable incoming/chirpity_*.deb

      - name: Show repository contents
        run: |
          echo "=== Packages ==="
          find repo/pool -type f -print

          echo
          echo "=== Repository metadata ==="
          find repo/dists -type f -print

      # ------------------------------------------------------------
      # Persist repository state
      # ------------------------------------------------------------

      - name: Commit repository state
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No repository changes."
          else
            git commit -m "Update APT repository"
            git push origin apt-data
          fi

      # ------------------------------------------------------------
      # GitHub Pages
      # ------------------------------------------------------------

      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site

          cp -a repo/dists site/
          cp -a repo/pool site/
          cp -a repo/apt-repo-public-key.asc site/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
